<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BioGeoHR Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar navigation, shared across every page -->
    <aside class="sidebar">
        <div class="logo">BioGeoHR</div>

        <nav>
            <a class="nav-item active" href="dashboard.html">▦ Dashboard</a>

            <!-- Employee section: expands to show its submenu -->
            <div class="nav-item nav-parent" id="empToggle">
                👤 Employee <span class="chev">▾</span>
            </div>
            <div class="sub-nav" id="empSubNav">
                <a class="sub-item" href="allEmp.html">All Employee</a>
                <a class="sub-item" href="allEmp.html">Leave Request</a>
                <a class="sub-item" href="allEmp.html">New Employee</a>
            </div>

            <!-- Attendance section: expands to show its submenu -->
            <div class="nav-item nav-parent" id="attToggle">
                📋 Attendance <span class="chev">▾</span>
            </div>
            <div class="sub-nav" id="attSubNav">
                <a class="sub-item" href="attendance.html">Attendance</a>
                <a class="sub-item" href="attendance.html">Location</a>
            </div>

            <a class="nav-item" href="#">💵 Payroll</a>
        </nav>

        <button class="logout">Log-out</button>
    </aside>

    <main class="main">
        <h1 class="title">Dashboard</h1>

        <!-- Summary metric cards (total employees, attendance rate, etc.) -->
        <div class="stat-row" id="statRow"></div>

        <div class="grid">
            <div>
                <!-- Weekly attendance breakdown chart -->
                <div class="card">
                    <h2>Weekly Attendance</h2>
                    <div class="chart" id="chart"></div>
                    <div class="legend">
                        <span><i class="on-time"></i>On-Time</span>
                        <span><i class="late"></i>Late</span>
                        <span><i class="absent"></i>Absent</span>
                        <span><i class="leave"></i>Leave</span>
                    </div>
                </div>

                <!-- Employee summary table -->
                <div class="card">
                    <h2>List of Employee</h2>
                    <table id="empTable"></table>
                </div>
            </div>

            <div>
                <!-- Current month calendar -->
                <div class="card">
                    <h2>Calendar</h2>
                    <div class="cal-grid" id="calendar"></div>
                </div>

                <!-- Pending leave requests -->
                <div class="card">
                    <h2>Leave Request</h2>
                    <div id="leaveList"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="script.js"></script>
</body>
</html>
